<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23483D">
  <title>Menú | La cocina de Doña Niña</title>
  <meta name="description" content="Menú de La cocina de Doña Niña: comida criolla dominicana.">
  <link rel="icon" href="images/logo_negro.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
  <header class="hero">
    <img class="hero__logo" src="images/logo_negro.png" alt="La cocina de Doña Niña" width="340" height="128">
    <p class="hero__tagline">Sabor casero, con mucho amor</p>
  </header>

  <!-- Banner Rooftop animado (estrellas, luces y ciudad): para quitarlo, borra este bloque (y js/banner.js) -->
  <section class="promo" aria-label="Nuestro Rooftop">
    <div class="promo__lights" aria-hidden="true"></div>
    <div class="promo__stars" id="stars" aria-hidden="true"></div>
    <div class="promo__content">
      <span class="promo__pill"><i class="promo__dot"></i>Rooftop</span>
      <h2 class="promo__title">Sabor criollo en las <span class="promo__accent">alturas</span></h2>
      <p class="promo__text" id="promo-text">Disfruta tu comida con el cielo como techo</p>
    </div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Secciones del menú"></nav>

  <main id="menu" class="menu"></main>

  <footer class="footer">
    <img src="images/logo_negro.png" alt="" width="170" height="64">
    <p class="footer__copy">&copy; 2026 La Cocina de Doña Niña. Todos los derechos reservados.</p>
  </footer>

  <dialog class="modal" id="modal">
    <form method="dialog"><button class="modal__close" aria-label="Cerrar">&times;</button></form>
    <img class="modal__img" id="modal-img" alt="">
    <div class="modal__body">
      <h3 id="modal-name"></h3>
      <p id="modal-desc"></p>
      <div id="modal-price"></div>
    </div>
  </dialog>

  <script src="js/menu-data.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
  <script src="js/banner.js?v=6"></script>
</body>
</html>
