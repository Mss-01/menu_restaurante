<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23483D">
  <title>Menú | La cocina de Doña Niña</title>
  <meta name="description" content="Menú de La cocina de Doña Niña: comida criolla dominicana.">
  <link rel="icon" href="images/logo_blanco.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="hero">
    <img class="hero__logo" src="images/logo_blanco.png" alt="La cocina de Doña Niña" width="340" height="128">
    <p class="hero__tagline">Comida criolla dominicana</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Secciones del menú"></nav>

  <main id="menu" class="menu"></main>

  <footer class="footer">
    <img src="images/logo_blanco.png" alt="" width="170" height="64">
  </footer>

  <dialog class="modal" id="modal">
    <form method="dialog"><button class="modal__close" aria-label="Cerrar">&times;</button></form>
    <img class="modal__img" id="modal-img" alt="">
    <div class="modal__body">
      <h3 id="modal-name"></h3>
      <p id="modal-desc"></p>
      <span class="price" id="modal-price"></span>
    </div>
  </dialog>

  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
